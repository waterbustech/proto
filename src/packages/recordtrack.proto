syntax = "proto3";

import "sub-packages/utils/ping.proto";

message StartRecordRequest {
    int32 userId = 1;
    int32 meetingId = 2;
}

message StopRecordRequest {
    int32 recordId = 1;
    repeated string urlToVideos = 2;
    repeated string urlToAudios = 3;
}

message RecordResponse {
    bool succeed = 1;
}

service RecordService {
    rpc ping(PingPayload) returns (PingPayload) {}
    rpc startRecord(StartRecordRequest) returns (RecordResponse) {}
    rpc stopRecord(StopRecordRequest) returns (RecordResponse) {}
}
